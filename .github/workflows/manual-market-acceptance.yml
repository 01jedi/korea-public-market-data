name: Manual Korean public market acceptance
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect 72h twice, identical closed window
        run: |
          python scripts/collect_korea.py --out evidence/cloud/run1
          END=$(python -c 'import json; print(json.load(open("evidence/cloud/run1/summary.json"))["end_exclusive_utc"].replace("+00:00", ""))')
          python scripts/collect_korea.py --out evidence/cloud/run2 --end "$END"
      - name: Validate actual responses
        run: python scripts/validate_collection.py evidence/cloud
      - name: Publish public result even when acceptance is partial
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_public.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-market-evidence
          path: evidence/cloud/
          retention-days: 7
